# GitHub Pages (Jekyll) config for the SwiftPMX docs site — served from /docs on main.
#
# Theme: just-the-docs (left sidebar nav + search). Pinned to v0.3.3, the last release
# compatible with GitHub Pages' native (no-Actions) build, which pins Jekyll 3.9.
# Sidebar entries/order come from each page's `title` / `nav_order` front matter.
# Matches the OCCTSwift docs setup so the ecosystem reads consistently.
title: SwiftPMX
description: A native-Swift, dependency-free reader for PMX (MikuMikuDance) 3D model geometry — macOS / iOS / Linux.
remote_theme: just-the-docs/just-the-docs@v0.3.3

# just-the-docs options
search_enabled: true
heading_anchors: true
aux_links:
  "GitHub": ["https://github.com/SecondMouseAU/SwiftPMX"]
aux_links_new_tab: true

exclude:
  - "*.sh"
  - Gemfile
  - Gemfile.lock
